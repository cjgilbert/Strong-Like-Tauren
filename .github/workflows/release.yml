# Pushing a version tag (e.g. v0.1.6) packages the addon with BigWigsMods/packager and uploads it to
# CurseForge (project ID from X-Curse-Project-ID in the TOC; game version from ## Interface 16001 = Forever)
# and to a GitHub Release. Tags containing "beta" or "alpha" upload as beta/alpha files.
name: Package and release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
